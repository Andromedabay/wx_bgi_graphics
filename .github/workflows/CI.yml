name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-matrix-debug:
    name: CI Debug (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Doxygen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install doxygen.install -y

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen \
            libglfw3-dev \
            libwxgtk3.2-dev \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Install Doxygen (macOS)
        if: runner.os == 'macOS'
        run: brew install doxygen wxwidgets glfw

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Debug CI enables deterministic keyboard seam checks (test-only surface).
        run: cmake -S . -B build -DWXBGI_ENABLE_TEST_SEAMS=ON

      - name: Build (Windows Debug)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build -j --config Debug

      - name: Install Mesa software renderer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # pal1000/mesa-dist-win provides Mesa3D for Windows (llvmpipe/gallium-d3d12).
          # Placing its DLLs next to the library/test binary gives GLFW a real OpenGL
          # 2.1 driver that the Windows GDI stub cannot provide on headless CI VMs.
          $rel = Invoke-RestMethod `
            'https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest' `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; 'User-Agent' = 'gh-actions' }
          $asset = $rel.assets |
            Where-Object { $_.name -match 'release-msvc\.7z$' } |
            Sort-Object name |
            Select-Object -First 1
          if (-not $asset) { throw 'Mesa release-msvc.7z asset not found in latest mesa-dist-win release' }
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $mesaDir = (Get-ChildItem mesa -Recurse -Filter 'opengl32.dll' |
                      Where-Object { $_.DirectoryName -match 'x64' } |
                      Select-Object -First 1).DirectoryName
          if (-not $mesaDir) { throw 'Mesa x64 opengl32.dll not found in archive' }
          New-Item -ItemType Directory -Force -Path build\Debug | Out-Null
          Get-ChildItem $mesaDir -Filter '*.dll' |
            ForEach-Object { Copy-Item $_.FullName "build\Debug\$($_.Name)" -Force }

      - name: Test (Windows Debug)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: 3.3
          MESA_GLSL_VERSION_OVERRIDE: 330
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 90

      - name: Docs (Windows Debug)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --target api_docs -j --config Debug

      - name: Configure (Linux Debug)
        if: runner.os == 'Linux'
        # Debug CI enables deterministic keyboard seam checks (test-only surface).
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGLFW_BUILD_WAYLAND=OFF -DWXBGI_ENABLE_TEST_SEAMS=ON -DWXBGI_SYSTEM_WX=ON -DWXBGI_SYSTEM_GLFW=ON

      - name: Configure (macOS Debug)
        if: runner.os == 'macOS'
        # Debug CI enables deterministic keyboard seam checks (test-only surface).
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWXBGI_ENABLE_TEST_SEAMS=ON -DWXBGI_SYSTEM_WX=ON -DWXBGI_SYSTEM_GLFW=ON

      - name: Build (Linux/macOS Debug)
        if: runner.os != 'Windows'
        run: cmake --build build -j

      - name: Test (Linux Debug)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Skip runtime tests (macOS Debug)
        if: runner.os == 'macOS'
        run: |
          echo "Skipping GUI runtime tests on GitHub-hosted macOS runners."
          echo "GLFW window creation requires a WindowServer-backed session, which is not available in hosted CI."

      - name: Docs (Linux/macOS Debug)
        if: runner.os != 'Windows'
        run: cmake --build build --target api_docs -j

  release-build-matrix:
    name: Release Build (${{ matrix.os }} / ${{ matrix.variant }})
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: builtin_wxwidgets
            build_dir: build_b
            artifact_prefix: pack_b_wxwidg
            enable_wx: ON
            system_wx: OFF
            system_glfw: OFF
          - os: windows-latest
            variant: system_wxwidgets
            build_dir: build_s
            artifact_prefix: pack_s_wxwidg
            enable_wx: ON
            system_wx: ON
            system_glfw: OFF
          - os: windows-latest
            variant: no_wxwidgets
            build_dir: build_n
            artifact_prefix: pack_n_wxwidg
            enable_wx: OFF
            system_wx: OFF
            system_glfw: OFF
          - os: ubuntu-latest
            variant: builtin_wxwidgets
            build_dir: build_b
            artifact_prefix: pack_b_wxwidg
            enable_wx: ON
            system_wx: OFF
            system_glfw: OFF
          - os: ubuntu-latest
            variant: system_wxwidgets
            build_dir: build_s
            artifact_prefix: pack_s_wxwidg
            enable_wx: ON
            system_wx: ON
            system_glfw: OFF
          - os: ubuntu-latest
            variant: no_wxwidgets
            build_dir: build_n
            artifact_prefix: pack_n_wxwidg
            enable_wx: OFF
            system_wx: OFF
            system_glfw: OFF
          - os: macos-latest
            variant: builtin_wxwidgets
            build_dir: build_b
            artifact_prefix: pack_b_wxwidg
            enable_wx: ON
            system_wx: OFF
            system_glfw: OFF
          - os: macos-latest
            variant: system_wxwidgets
            build_dir: build_s
            artifact_prefix: pack_s_wxwidg
            enable_wx: ON
            system_wx: ON
            system_glfw: ON
          - os: macos-latest
            variant: no_wxwidgets
            build_dir: build_n
            artifact_prefix: pack_n_wxwidg
            enable_wx: OFF
            system_wx: OFF
            system_glfw: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Doxygen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install doxygen.install -y

      - name: Install System wxWidgets (Windows)
        if: runner.os == 'Windows' && matrix.system_wx == true
        shell: pwsh
        run: choco install wxwidgets -y

      - name: Install System GLFW (Windows)
        if: runner.os == 'Windows' && matrix.system_glfw == true
        shell: pwsh
        run: choco install glfw3 -y

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev xvfb \
            build-essential libgtk-3-dev libgl1-mesa-dev \
            libglu1-mesa-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev

      - name: Install System wxWidgets (Linux, system_wx)
        if: runner.os == 'Linux' && matrix.system_wx == true
        run: |
          sudo apt-get install -y libwxbase3.2-dev libwxgtk3.2-dev wx-common
          # Note: If using an older Ubuntu runner version like Ubuntu 20.04 or 22.04 where 3.2 isn't default, 
          # use libwxgtk3.0-gtk3-dev instead:
          # sudo apt-get install -y libwxgtk3.0-gtk3-dev

      - name: Install System GLFW (Linux, system_glfw)
        if: runner.os == 'Linux' && matrix.system_glfw == true
        run: sudo apt-get install -y libglfw3-dev

      - name: Install Doxygen (macOS)
        if: runner.os == 'macOS'
        run: brew install doxygen glfw

      - name: Install System wxWidgets (macOS)
        if: runner.os == 'macOS' && matrix.system_wx == true
        run: brew install wxwidgets

      - name: Set CMAKE_PREFIX_PATH (Windows, system_glfw)
        shell: pwsh
        if: runner.os == 'Windows' && matrix.system_glfw == true
        run: |
          $prefix="C:\\ProgramData\\chocolatey\\lib\\glfw3\\tools"
          if (  [String]::IsNullOrWhiteSpace($env:CMAKE_PREFIX_PATH) ) {
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$prefix"
          }
          else {
              $newPath = "$env:CMAKE_PREFIX_PATH;$prefix"
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$newPath"
          }

      - name: Set CMAKE_PREFIX_PATH (Windows, system_wx)
        shell: pwsh
        if: runner.os == 'Windows' && matrix.system_wx == true
        run: |
          $prefix="C:\\wxWidgets-3.3.1"
          if (  [String]::IsNullOrWhiteSpace($env:CMAKE_PREFIX_PATH) ) {
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$prefix"
          }
          else {
              $newPath = "$env:CMAKE_PREFIX_PATH;$prefix"
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$newPath"
          }

      - name: Set CMAKE_PREFIX_PATH (Windows, system_glfw == false, system_wx == false)
        shell: pwsh
        if: runner.os == 'Windows' && matrix.system_glfw == false && matrix.system_wx == false
        run: |
          if (  [String]::IsNullOrWhiteSpace($env:CMAKE_PREFIX_PATH) ) {
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH="
          }

      - name: Debug env (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: echo "CMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH"

      - name: Configure (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          ENABLE_WX: ${{ matrix.enable_wx }}
          SYSTEM_WX: ${{ matrix.system_wx }}
          SYSTEM_GLFW: ${{ matrix.system_glfw }}
        run: |
          $args = @(
            '-S', '.',
            '-B', $env:BUILD_DIR,
            '-DWXBGI_ENABLE_TEST_SEAMS=OFF',
            "-DWXBGI_ENABLE_WX=$env:ENABLE_WX",
            "-DCMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH"
          )
          if ($env:SYSTEM_WX -eq 'true') { $args += '-DWXBGI_SYSTEM_WX=ON' }
          if ($env:SYSTEM_GLFW -eq 'true') { $args += '-DWXBGI_SYSTEM_GLFW=ON' }
          cmake @args

      - name: Configure
        if: runner.os != 'Windows'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          ENABLE_WX: ${{ matrix.enable_wx }}
          SYSTEM_WX: ${{ matrix.system_wx }}
          SYSTEM_GLFW: ${{ matrix.system_glfw }}
        run: |
          args=(-S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DWXBGI_ENABLE_TEST_SEAMS=OFF -DWXBGI_ENABLE_WX="$ENABLE_WX")
          if [ "$RUNNER_OS" = "Linux" ]; then
            args+=(-DGLFW_BUILD_WAYLAND=OFF)
          fi
          if [ "$SYSTEM_WX" = "ON" ]; then
            args+=(-DWXBGI_SYSTEM_WX=ON)
          fi
          if [ "$SYSTEM_GLFW" = "ON" ]; then
            args+=(-DWXBGI_SYSTEM_GLFW=ON)
          fi
          cmake "${args[@]}"

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: cmake --build $env:BUILD_DIR -j --config Release

      - name: Set CMAKE_PREFIX_PATH (Not-Windows, system_glfw)
        if: runner.os != 'Windows' && matrix.system_glfw == true
        run: |
          prefix="/usr/local"
          if [ -z "$CMAKE_PREFIX_PATH" ]; then
              echo "CMAKE_PREFIX_PATH=$prefix" >> $GITHUB_ENV
          else
              newPath="$CMAKE_PREFIX_PATH:$prefix"
              echo "CMAKE_PREFIX_PATH=$newPath" >> $GITHUB_ENV
          fi

      - name: Set CMAKE_PREFIX_PATH (Not-Windows, system_wx)
        if: runner.os != 'Windows' && matrix.system_wx == true
        run: |
          prefix="/usr/local"
          if [ -z "$CMAKE_PREFIX_PATH" ]; then
              echo "CMAKE_PREFIX_PATH=$prefix" >> $GITHUB_ENV
          else
              newPath="$CMAKE_PREFIX_PATH:$prefix"
              echo "CMAKE_PREFIX_PATH=$newPath" >> $GITHUB_ENV
          fi

      - name: Set CMAKE_PREFIX_PATH (Not-Windows, system_glfw == false, system_wx == false)
        if: runner.os != 'Windows' && matrix.system_glfw == false && matrix.system_wx == false
        run: |
          if [ -z "$CMAKE_PREFIX_PATH" ]; then
              echo "CMAKE_PREFIX_PATH=" >> $GITHUB_ENV
          fi

      - name: Debug env (Not-Windows)
        if: runner.os != 'Windows'
        run: |
          set
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"

      - name: Build
        if: runner.os != 'Windows'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: cmake --build "$BUILD_DIR" -j --config Release

      - name: Install Mesa software renderer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          $rel = Invoke-RestMethod `
            'https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest' `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; 'User-Agent' = 'gh-actions' }
          $asset = $rel.assets |
            Where-Object { $_.name -match 'release-msvc\.7z$' } |
            Sort-Object name |
            Select-Object -First 1
          if (-not $asset) { throw 'Mesa release-msvc.7z asset not found in latest mesa-dist-win release' }
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $mesaDir = (Get-ChildItem mesa -Recurse -Filter 'opengl32.dll' |
                      Where-Object { $_.DirectoryName -match 'x64' } |
                      Select-Object -First 1).DirectoryName
          if (-not $mesaDir) { throw 'Mesa x64 opengl32.dll not found in archive' }
          New-Item -ItemType Directory -Force -Path "$env:BUILD_DIR\Release" | Out-Null
          Get-ChildItem $mesaDir -Filter '*.dll' |
            ForEach-Object { Copy-Item $_.FullName "$env:BUILD_DIR\Release\$($_.Name)" -Force }

      - name: Test
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: 3.3
          MESA_GLSL_VERSION_OVERRIDE: 330
        run: ctest --test-dir $env:BUILD_DIR -C Release --output-on-failure --timeout 90

      - name: Test
        if: runner.os == 'Linux'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: xvfb-run -a ctest --test-dir "$BUILD_DIR" --output-on-failure

      - name: Skip runtime tests (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Skipping GUI runtime tests on GitHub-hosted macOS runners."
          echo "GLFW window creation requires a WindowServer-backed session, which is not available in hosted CI."

      - name: Package headers and library
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: cmake --build $env:BUILD_DIR --target wx_bgi_headers_package -j --config Release

      - name: Package headers and library
        if: runner.os != 'Windows'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: cmake --build "$BUILD_DIR" --target wx_bgi_headers_package -j

      - name: Archive build artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          ARCHIVE_BASE: ${{ matrix.artifact_prefix }}-${{ matrix.os }}
        run: Compress-Archive -Path "$env:BUILD_DIR\artifacts\*" -DestinationPath "$env:ARCHIVE_BASE.zip" -Force

      - name: Archive build artifacts
        if: runner.os != 'Windows'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          ARCHIVE_BASE: ${{ matrix.artifact_prefix }}-${{ matrix.os }}
        run: tar -czf "$ARCHIVE_BASE.tar.gz" -C "$BUILD_DIR/artifacts" .

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ matrix.os }}
          path: ${{ matrix.artifact_prefix }}-${{ matrix.os }}.zip
          if-no-files-found: error

      - name: Upload build artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ matrix.os }}
          path: ${{ matrix.artifact_prefix }}-${{ matrix.os }}.tar.gz
          if-no-files-found: error

  release-docs-archives:
    name: Release Docs Archives
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen zip \
            libglfw3-dev \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latexmk \
            libwxgtk3.2-dev \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure (Release)
        # Published docs should reflect release-safe API surface (seams OFF).
        run: cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF -DWXBGI_ENABLE_TEST_SEAMS=OFF -DWXBGI_SYSTEM_WX=ON -DWXBGI_SYSTEM_GLFW=ON

      - name: Generate docs
        run: |
          cmake --build build-rel --target api_docs -j
          cmake --build build-rel --target api_docs_pdf -j

      - name: Package docs
        run: |
          mkdir -p build-rel/doxygen/release-docs
          cp -r build-rel/doxygen/html build-rel/doxygen/release-docs/html
          cp build-rel/doxygen/latex/refman.pdf build-rel/doxygen/release-docs/api-docs.pdf
          cd build-rel/doxygen/release-docs
          zip -r ../../../api-docs.zip .
          tar -czf ../../../api-docs.tar.gz .

      - name: Upload docs zip
        uses: actions/upload-artifact@v4
        with:
          name: release-docs-zip
          path: api-docs.zip
          if-no-files-found: error

      - name: Upload docs tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: release-docs-targz
          path: api-docs.tar.gz
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-rel/doxygen/html

  release-notes:
    name: Build Release Notes
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      notes_file: ${{ steps.notes.outputs.notes_file }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate notes from commit messages
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)"

          NOTES_FILE="release-notes.md"
          {
            echo "## ${CURRENT_TAG}"
            echo
            echo "### Changes"
            echo
            if [ -n "${PREV_TAG}" ]; then
              git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:'- %h %s'
            else
              git log "${CURRENT_TAG}" --pretty=format:'- %h %s'
            fi
          } > "${NOTES_FILE}"

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "## ${CURRENT_TAG}" > "${NOTES_FILE}"
            echo >> "${NOTES_FILE}"
            echo "- Initial release." >> "${NOTES_FILE}"
          fi

          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ steps.notes.outputs.notes_file }}
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - release-build-matrix
      - release-docs-archives
      - release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show release payload
        run: find dist -maxdepth 3 -type f | sort

      - name: Read release notes
        run: cp dist/release-notes/release-notes.md ./release-notes.md

      - name: Publish release with binaries, docs, and notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*/*.zip
            dist/*/*.tar.gz
            dist/release-docs-zip/api-docs.zip
            dist/release-docs-targz/api-docs.tar.gz
          fail_on_unmatched_files: true

  deploy-docs-pages:
    name: Deploy API Docs to GitHub Pages
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - release-docs-archives
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
